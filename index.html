// 表头识别：找到含“姓名”的行
function gaImportAfterRows() {
  var rows = _gaImp.rows;
  var msg = el('ga-im-msg'), pv = el('ga-im-preview'), ok = el('ga-im-ok');
  if (!rows || !rows.length) {
    if (msg) msg.innerHTML = '<span style="color:var(--danger)">没有读取到任何数据行</span>';
    if (ok) ok.disabled = true;
    return;
  }
  var subs = gaSubjects();
  var hi = -1;
  for (var i = 0; i < Math.min(rows.length, 15); i++) {
    var r = (rows[i] || []).map(function(x) { return String(x == null ? '' : x).replace(/[\s\u3000]/g, ''); });
    var hasName = r.indexOf('姓名') >= 0 || r.indexOf('学生姓名') >= 0 || r.indexOf('名字') >= 0;
    var hasCls = r.indexOf('班级') >= 0;
    var hasSub = subs.some(function(s) { return r.some(function(c) { return c.indexOf(s) >= 0; }); });
    if (hasName && (hasCls || hasSub)) { hi = i; break; }
  }
  if (hi < 0) {
    if (msg) msg.innerHTML = '<span style="color:var(--danger)">未能识别表头：请确认表格首行包含「姓名」以及「班级」或各科目名称（如 语文、数学…）。</span>';
    if (pv) pv.innerHTML = '';
    if (ok) ok.disabled = true;
    return;
  }
  var head = (rows[hi] || []).map(function(x) { return String(x == null ? '' : x).trim(); });
  var map = { name: -1, cls: -1, no: -1, subs: {} };
  head.forEach(function(h, ci) {
    var hh = h.replace(/[\s\u3000]/g, '');
    if (hh === '姓名' || hh === '学生姓名' || hh === '名字' || hh === '学生') { if (map.name < 0) map.name = ci; return; }
    if (hh === '班级' || hh === '班') { if (map.cls < 0) map.cls = ci; return; }
    if (hh.indexOf('考试号') >= 0 || hh.indexOf('考号') >= 0 || hh.indexOf('学号') >= 0) { if (map.no < 0) map.no = ci; return; }
    subs.forEach(function(s) { if (map.subs[s] === undefined && hh.indexOf(s) >= 0) map.subs[s] = ci; });
  });
  _gaImp.head = head;
  _gaImp.map = map;
  _gaImp.hi = hi;
  if (map.name < 0) {
    if (msg) msg.innerHTML = '<span style="color:var(--danger)">未识别到「姓名」列，无法导入。</span>';
    if (ok) ok.disabled = true;
    return;
  }
  var subFound = subs.filter(function(s) { return map.subs[s] !== undefined; });
  if (!subFound.length) {
    if (msg) msg.innerHTML = '<span style="color:var(--danger)">未识别到任何科目列（当前科目：' + esc(subs.join('、')) + '）。可到「👩‍🏫 任课教师」页添加科目后重试。</span>';
    if (ok) ok.disabled = true;
    return;
  }
  var body = rows.slice(hi + 1).filter(function(r) {
    return r && r.length && String(r[map.name] == null ? '' : r[map.name]).trim();
  });
  var pre = '<div class="ga-tip" style="margin:10px 0 4px">识别到 <b>' + body.length + '</b> 条学生记录；科目列：' +
    esc(subFound.join('、')) + (map.cls >= 0 ? '；班级列：' + esc(head[map.cls]) : '') +
    (map.no >= 0 ? '；考试号列：' + esc(head[map.no]) : '') + '</div>' +
    '<div class="ga-scroll" style="max-height:240px;overflow:auto;border:1px solid var(--border);border-radius:8px">' +
    '<table class="ga-tbl"><thead><tr><th>姓名</th><th>班级</th>';
  subFound.forEach(function(s) { pre += '<th>' + esc(s) + '</th>'; });
  pre += '</tr></thead><tbody>';
  body.slice(0, 8).forEach(function(r) {
    pre += '<tr><td>' + esc(r[map.name]) + '</td><td>' + esc(map.cls >= 0 ? r[map.cls] : '') + '</td>';
    subFound.forEach(function(s) { pre += '<td class="ga-num">' + esc(r[map.subs[s]]) + '</td>'; });
    pre += '</tr>';
  });
  pre += '</tbody></table></div>';
  if (body.length > 8) pre += '<div class="ga-tip" style="margin-top:4px">… 仅预览前 8 条，共 ' + body.length + ' 条</div>';
  if (pv) pv.innerHTML = pre;
  if (msg) msg.innerHTML = '';
  if (ok) ok.disabled = body.length === 0;
}

function gaImportCommit() {
  var rows = _gaImp.rows, map = _gaImp.map;
  if (!rows || !rows.length || !map) return;
  var subs = gaSubjects();
  var subFound = subs.filter(function(s) { return map.subs[s] !== undefined; });
  var nameEl = el('ga-im-name'), dateEl = el('ga-im-date');
  var name = (nameEl && nameEl.value.trim()) || ('导入考试 ' + todayStr());
  var date = (dateEl && dateEl.value) || todayStr();

  var d = ga();
  var students = [], added = {};
  var skipTo = (_gaImp.hi === undefined || _gaImp.hi === null) ? -1 : _gaImp.hi;
  rows.forEach(function(r, ri) {
    if (!r || ri <= skipTo) return;
    var nm = String(r[map.name] == null ? '' : r[map.name]).trim();
    if (!nm) return;
    var cls = map.cls >= 0 ? String(r[map.cls] == null ? '' : r[map.cls]).trim() : '';
    var no = map.no >= 0 ? String(r[map.no] == null ? '' : r[map.no]).trim() : '';
    var scores = {};
    subs.forEach(function(s) {
      scores[s] = map.subs[s] === undefined ? null : gaNum(r[map.subs[s]]);
    });
    students.push({ id: students.length + 1, name: nm, cls: cls, no: no, scores: scores });
    if (cls && d.teachers.classes.indexOf(cls) < 0 && !added[cls]) { added[cls] = 1; d.teachers.classes.push(cls); }
  });
  if (!students.length) { toast('没有可导入的学生数据', 'error'); return; }

  var ex = {
    id: uid(d.exams), name: name, date: date, students: students, lines: {},
    cmpId: d.exams.length ? d.exams[d.exams.length - 1].id : null
  };
  d.exams.push(ex);
  d.curId = ex.id;
  _gaRankCache = {};
  gaTab = 'avg';
  save(); closeModalForce(); renderPage();
  toast('已导入「' + name + '」共 ' + students.length + ' 名学生' + (subFound.length ? '（' + subFound.join('/') + '）' : ''));
}

function gaTPick(inp) {
  var f = inp.files && inp.files[0];
  if (!f) return;
  var rd = new FileReader();
  var msg = el('ga-t-msg');
  if (msg) msg.innerHTML = '正在读取：' + esc(f.name) + ' …';
  if (/\.xlsx$/i.test(f.name)) {
    rd.onload = function(e) {
      try {
        var z = gaXlsxSheets(e.target.result);
        if (!z.sheets.length) throw new Error('文件中未找到工作表');
        var picked = null;
        z.sheets.forEach(function(s) { if (!picked && s.name.indexOf('教师') >= 0) picked = s; });
        var sheet = picked || z.sheets[0];
        _gaT.rows = gaXlsxRows(z.map, sheet.path);
        if (msg) msg.innerHTML = '已读取工作表：' + esc(sheet.name);
        gaTAfterRows();
      } catch (err) {
        if (msg) msg.innerHTML = '<span style="color:var(--danger)">解析失败：' + esc(err && err.message ? err.message : String(err)) + '</span>';
      }
    };
    rd.readAsArrayBuffer(f);
  } else {
    rd.onload = function(e) { _gaT.rows = gaRowsFromText(e.target.result); gaTAfterRows(); };
    rd.readAsText(f);
  }
}

function gaTAfterRows() {
  var rows = _gaT.rows, msg = el('ga-t-msg'), pv = el('ga-t-preview'), ok = el('ga-t-ok');
  if (!rows || !rows.length) { if (ok) ok.disabled = true; return; }
  var subs = gaSubjects();
  var hi = -1;
  for (var i = 0; i < Math.min(rows.length, 15); i++) {
    var r = (rows[i] || []).map(function(x) { return String(x == null ? '' : x).replace(/[\s\u3000]/g, ''); });
    if (r.indexOf('班级') >= 0 && (r.indexOf('班主任') >= 0 || r.some(function(c) { return subs.indexOf(c) >= 0; }))) { hi = i; break; }
  }
  if (hi < 0) {
    if (msg) msg.innerHTML = '<span style="color:var(--danger)">未识别到表头：请确认表头含「班级」和「班主任」。</span>';
    if (ok) ok.disabled = true;
    return;
  }
  var head = (rows[hi] || []).map(function(x) { return String(x == null ? '' : x).trim(); });
  var cm = { cls: -1, master: -1, subs: {} };
  head.forEach(function(h, ci) {
    var hh = h.replace(/[\s\u3000]/g, '');
    if (hh === '班级' || hh === '班') { if (cm.cls < 0) cm.cls = ci; return; }
    if (hh.indexOf('班主任') >= 0) { if (cm.master < 0) cm.master = ci; return; }
    subs.forEach(function(s) { if (cm.subs[s] === undefined && hh.indexOf(s) >= 0) cm.subs[s] = ci; });
  });
  if (cm.cls < 0) {
    if (msg) msg.innerHTML = '<span style="color:var(--danger)">未识别到「班级」列。</span>';
    if (ok) ok.disabled = true; return;
  }
  var found = subs.filter(function(s) { return cm.subs[s] !== undefined; });
  if (cm.master < 0 && !found.length) {
    if (msg) msg.innerHTML = '<span style="color:var(--danger)">未识别到教师列。</span>';
    if (ok) ok.disabled = true; return;
  }
  _gaT.head = head; _gaT.cm = cm;
  var body = rows.slice(hi + 1).filter(function(r) { return r && String(r[cm.cls] == null ? '' : r[cm.cls]).trim(); });
  var pre = '<div class="ga-tip" style="margin:10px 0 4px">识别到 <b>' + body.length + '</b> 个班级；教师列：' +
    esc(found.join('、')) + (cm.master >= 0 ? '、班主任' : '') + '</div>' +
    '<div class="ga-scroll" style="max-height:260px;overflow:auto;border:1px solid var(--border);border-radius:8px">' +
    '<table class="ga-tbl"><thead><tr><th>班级</th><th>班主任</th>';
  found.forEach(function(s) { pre += '<th>' + esc(s) + '</th>'; });
  pre += '</tr></thead><tbody>';
  body.forEach(function(r) {
    pre += '<tr><td><b>' + esc(r[cm.cls]) + '</b></td><td>' + esc(cm.master >= 0 ? r[cm.master] : '') + '</td>';
    found.forEach(function(s) { pre += '<td>' + esc(r[cm.subs[s]]) + '</td>'; });
    pre += '</tr>';
  });
  pre += '</tbody></table></div>';
  if (pv) pv.innerHTML = pre;
  if (msg) msg.innerHTML = '';
  if (ok) ok.disabled = body.length === 0;
}

function gaTCommit() {
  var rows = _gaT.rows, cm = _gaT.cm;
  if (!rows || !cm) return;
  var d = ga(), subs = d.subjects;
  var found = subs.filter(function(s) { return cm.subs[s] !== undefined; });
  var n = 0;
  rows.forEach(function(r) {
    if (!r) return;
    var cls = String(r[cm.cls] == null ? '' : r[cm.cls]).trim();
    if (!cls || cls === '班级') return;
    var trow = d.teachers.rows[cls] || (d.teachers.rows[cls] = {});
    if (cm.master >= 0) trow['班主任'] = String(r[cm.master] == null ? '' : r[cm.master]).replace(/[\s\u3000]/g, '');
    found.forEach(function(s) {
      var v = String(r[cm.subs[s]] == null ? '' : r[cm.subs[s]]).replace(/[\s\u3000]/g, '');
      if (v) trow[s] = v;
    });
    if (d.teachers.classes.indexOf(cls) < 0) d.teachers.classes.push(cls);
    n++;
  });
  save(); closeModalForce(); renderPage();
  toast('已导入 ' + n + ' 个班级的任课教师');
}

// ---------- 导出 / 示例数据 ----------
function gaExportCSV() {
  var ex = gaCurExam();
  if (!ex) { toast('当前没有可导出的考试', 'error'); return; }
  var subs = gaSubjects(), rk = gaRankMapCached(ex), counted = gaCountedSubjects(ex);
  var lines = ['姓名,班级,考试号,' + subs.join(',') + ',总分,年级排名,进步率'];
  (ex.students || []).forEach(function(s) {
    var r = gaTotalOf(s, counted), rkm = rk[gaStuKey(s)], prog = gaProgress(ex, s);
    var row = [s.name, s.cls, s.no || ''];
    subs.forEach(function(k) { var v = gaNum(s.scores ? s.scores[k] : null); row.push(v === null ? '' : v); });
    row.push(r.absent ? '' : r.total);
    row.push(rkm ? rkm.rank : '');
    row.push(prog === null ? '' : (prog * 100).toFixed(2) + '%');
    lines.push(row.map(function(x) { return '"' + String(x).replace(/"/g, '""') + '"'; }).join(','));
  });
  var blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '成绩分析_' + ex.name.replace(/[\\/:*?"<>|]/g, '_') + '_' + todayStr() + '.csv';
  a.click();
  toast('已导出 CSV');
}

function gsRand(seed) {
  var x = Math.sin(seed * 12.9898 + 78.233) * 43758.5453;
  return x - Math.floor(x);
}

// ---------- 文本 / CSV 与 xlsx 读取 ----------
function gaCSVLine(line) {
  var out = [], cur = '', q = false;
  for (var i = 0; i < line.length; i++) {
    var c = line.charAt(i);
    if (q) {
      if (c === '"') { if (line.charAt(i + 1) === '"') { cur += '"'; i++; } else q = false; }
      else cur += c;
    } else {
      if (c === '"') q = true;
      else if (c === ',' || c === '\t') { out.push(cur); cur = ''; }
      else cur += c;
    }
  }
  out.push(cur);
  return out.map(function(x) { return x.trim(); });
}

function gaRowsFromText(text) {
  if (!text) return [];
  var lines = String(text).replace(/\r\n?/g, '\n').split('\n');
  var out = [];
  for (var i = 0; i < lines.length; i++) {
    if (!lines[i].trim()) { out.push([]); continue; }
    out.push(gaCSVLine(lines[i]));
  }
  while (out.length && !out[out.length - 1].length) out.pop();
  return out;
}

// 列出 xlsx 中全部工作表（复用文件内已有的 ZIP / XML 解析能力）
function gaXlsxSheets(buffer) {
  var entries = xlsxZipEntries(buffer);
  var map = {};
  for (var i = 0; i < entries.length; i++) map[entries[i].name] = entries[i];
  var out = [];
  var wbEn = map['xl/workbook.xml'], relEn = map['xl/_rels/workbook.xml.rels'];
  if (wbEn && wbEn.data && relEn && relEn.data) {
    try {
      var wbDoc = xlsxParseXml(wbEn.data), relDoc = xlsxParseXml(relEn.data);
      var relMap = {};
      var relList = relDoc.getElementsByTagName('Relationship');
      for (var j = 0; j < relList.length; j++) {
        if ((relList[j].getAttribute('Type') || '').indexOf('/worksheet') >= 0) {
          relMap[relList[j].getAttribute('Id')] = relList[j].getAttribute('Target');
        }
      }
      var sheets = wbDoc.getElementsByTagName('sheet');
      for (var k = 0; k < sheets.length; k++) {
        var rid = sheets[k].getAttribute('r:id') || sheets[k].getAttribute('id') || '';
        var tgt = relMap[rid];
        if (!tgt) continue;
        var path = tgt.charAt(0) === '/' ? tgt.slice(1) : (/^xl\//.test(tgt) ? tgt : 'xl/' + tgt);
        if (map[path] && map[path].data) out.push({ name: sheets[k].getAttribute('name') || ('工作表' + (k + 1)), path: path });
      }
    } catch (e) {}
  }
  if (!out.length) {
    for (var m = 0; m < entries.length; m++) {
      if (/^xl\/worksheets\/[^\/]+\.xml$/.test(entries[m].name) && entries[m].data) {
        out.push({ name: entries[m].name.replace(/^.*\//, ''), path: entries[m].name });
      }
    }
  }
  return { sheets: out, map: map };
}

// 读取指定工作表的二维表格
// 说明：部分工作簿的工作表会声明并生成上万行空 <row>（例如 A1:U65536），
// 逐行走 DOM 会非常慢，故此处直接在 XML 文本上做一次扫描，速度与行数近似线性。
function gaUnesc(s) {
  return String(s)
    .replace(/&#x([0-9a-fA-F]+);/g, function(_, h) { return String.fromCharCode(parseInt(h, 16)); })
    .replace(/&#(\d+);/g, function(_, d) { return String.fromCharCode(parseInt(d, 10)); })
    .replace(/&lt;/g, '<').replace(/&gt;/g, '>')
    .replace(/&quot;/g, '"').replace(/&apos;/g, "'")
    .replace(/&amp;/g, '&');
}

function gaSharedStrings(map) {
  var shared = [];
  var ssEn = map['xl/sharedStrings.xml'];
  if (ssEn && ssEn.data) {
    try {
      var sdoc = xlsxParseXml(ssEn.data), sis = sdoc.getElementsByTagName('si');
      for (var a = 0; a < sis.length; a++) {
        var ts = sis[a].getElementsByTagName('t'), s = '';
        for (var b = 0; b < ts.length; b++) s += ts[b].textContent;
        shared.push(s);
      }
    } catch (e) { shared = []; }
  }
  return shared;
}

function gaCellText(attr, inner, shared) {
  var tm = /t="([^"]*)"/.exec(attr);
  var type = tm ? tm[1] : '';
  if (type === 's') {
    var vm = /<v>([\s\S]*?)<\/v>/.exec(inner);
    if (!vm) return '';
    return shared[parseInt(gaUnesc(vm[1]), 10)] || '';
  }
  if (type === 'inlineStr') {
    var out = '', tm2;
    var tRe = /<t[^>]*>([\s\S]*?)<\/t>/g;
    while ((tm2 = tRe.exec(inner))) out += tm2[1];
    return gaUnesc(out);
  }
  var v2 = /<v>([\s\S]*?)<\/v>/.exec(inner);
  if (!v2) return '';
  return type === 'str' ? gaUnesc(v2[1]) : v2[1];
}

function gaXlsxRows(map, path) {
  var en = map[path];
  if (!en) throw new Error('未找到该工作表');
  var shared = gaSharedStrings(map);
  var xml = xlsxDecode(en.data);
  var table = [], lastRow = 0;
  var rowRe = /<row\b([^>]*?)(?:\/>|>([\s\S]*?)<\/row>)/g;
  var rm;
  while ((rm = rowRe.exec(xml)) !== null) {
    var attrs = rm[1] || '', inner = rm[2] || '';
    var rNum = /r="(\d+)"/.exec(attrs);
    var rn = rNum ? parseInt(rNum[1], 10) : lastRow + 1;
    if (!rn || rn < lastRow + 1) rn = lastRow + 1;
    lastRow = rn;
    if (!inner) continue;   // 空行直接跳过，不分配数组
    var arr = [], colCursor = 0;
    var cellRe = /<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g;
    var cm2;
    while ((cm2 = cellRe.exec(inner)) !== null) {
      var cattr = cm2[1] || '', cinner = cm2[2] || '';
      var ci;
      var refm = /\br="([A-Z]+\d+)"/.exec(cattr);
      if (refm) { ci = xlsxColToIndex(refm[1]); colCursor = ci + 1; }
      else { ci = colCursor; colCursor++; }
      arr[ci] = gaCellText(cattr, cinner, shared);
    }
    table[rn - 1] = arr;
  }
  return table;
}

// ---------- 云同步（设置页） ----------
function wbSyncModeText() {
  if (wbTransport && wbTransport.ready) {
    return wbTransport.kind === 'sp' ? 'WorkBuddy 在线数据表 · 已连接' : '自建 Cloudflare Worker · 已连接';
  }
  var cfg = wbSelfCfg();
  if (cfg.url && cfg.key) return '已填配置但未连接（请点「测试连接」排查）';
  return '单机模式，数据只存本机浏览器';
}
// 换通道时把旧的轮询、缓存状态全部清干净，再重新初始化
function wbCloudReinit() {
  wbTransStop();
  wbCloud.ready = false; wbCloud.synced = false; wbCloud.busy = false; wbCloud.dirty = false;
  wbCloud.recIds = {}; wbCloud.lastShards = {};
  try { wbCloudInit(); } catch (e) { wbCloudPaint('off'); }
}
function saveWbCloud() {
  var url = (el('wbc-url').value || '').trim();
  var key = (el('wbc-key').value || '').trim();
  if (url && !/^https?:\/\//i.test(url)) url = 'https://' + url;
  url = url.replace(/\/+$/, '');
  if (!url || !key) {
    wbSelfClear();
    wbCloudReinit();
    toast('已清空云同步配置，回到单机模式');
    renderPage();
    return;
  }
  wbSelfSave(url, key);
  wbCloudReinit();
  toast('正在连接云端…');
  renderPage();
}
function testWbCloud() {
  var out = el('wbc-result');
  var url = (el('wbc-url').value || '').trim();
  var key = (el('wbc-key').value || '').trim();
  if (url && !/^https?:\/\//i.test(url)) url = 'https://' + url;
  url = url.replace(/\/+$/, '');
  if (!url || !key) { if (out) out.textContent = '请先填写地址和口令'; return; }
  if (out) out.textContent = '连接中…';
  var t0 = Date.now();
  fetch(url + '/api/ping', {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'x-wb-key': key },
    body: '{}'
  }).then(function(r) {
    return r.text().then(function(txt) { var j = null; try { j = JSON.parse(txt); } catch (e) {} return { r: r, j: j }; });
  }).then(function(o) {
    var ms = Date.now() - t0;
    if (o.r.ok && o.j && o.j.ok) {
      if (out) out.textContent = '连接成功 · 云端已有 ' + (o.j.count || 0) + ' 个分片、' + (o.j.images || 0) + ' 张图片（' + ms + 'ms）';
    } else if (o.r.status === 401) {
      if (out) out.textContent = '口令不对（401），请和后端的 WB_KEY 核对';
    } else if (o.r.status === 404) {
      if (out) out.textContent = '地址不对（404），确认填的是 Worker 根地址、不要带 /api';
    } else {
      if (out) out.textContent = '失败：' + ((o.j && (o.j.hint || o.j.error)) || ('HTTP ' + o.r.status));
    }
  }).catch(function(e) {
    if (out) out.textContent = '连不上：' + ((e && e.message) ? e.message : e) + '（确认地址能访问、且是 https）';
  });
}
function syncWbCloudNow() {
  if (!wbCloud.ready) { toast('未连接云端，请先「保存并连接」'); return; }
  var out = el('wbc-result');
  if (out) out.textContent = '同步中…';
  wbCloudPull({ reason: 'manual' }).then(function(applied) {
    if (!wbCloudLooksReal()) return 'sample';
    return wbCloudPush().then(function() { return applied ? 'applied' : 'ok'; });
  }).then(function(state) {
    var msg = state === 'sample' ? '本机还是示例数据，为避免覆盖云端真实数据，已跳过上传'
      : state === 'applied' ? '已从云端取回其他设备的更新'
        : '已同步（云端 ' + Object.keys(wbCloud.lastShards || {}).length + ' 个分片）';
    toast(msg);
    renderPage();
    var o2 = el('wbc-result'); if (o2) o2.textContent = msg;
  }).catch(function() {
    toast('同步失败，请检查网络与口令');
    renderPage();
  });
}
function wipeWbCloud() {
  if (!wbCloud.ready) { toast('未连接云端'); return; }

// 工作流串联：按待办当前字段在对应模块生成一条记录（新增与"编辑时新选串联"共用）
function addTodoFlowRecord(t) {
  if (!t || !t.flow || !t.studentId) return;
  var dt = t.deadline || todayStr();
  if (t.flow === 'homework') {
    DATA.homework.push({ id: uid(DATA.homework), studentId: t.studentId, date: dt, subject: '综合', status: '未完成', note: t.title, fromTodo: t.id });
  } else if (t.flow === 'comm') {
    var ps = getStudent(t.studentId);
    DATA.communications.push({
      id: uid(DATA.communications), studentId: t.studentId, date: dt, method: '电话',
      contact: (ps && ps.parentName) ? ps.parentName : '', content: t.note ? (t.title + '\n' + t.note) : t.title,
      result: '', images: [], fromTodo: t.id
    });
  }
}

function saveTodo() {
  var title = el('td-title').value.trim();
  if (!title) { toast('请输入任务标题', 'error'); return; }
  var rep = el('td-repeat').value;
  var rule = rep === 'none' ? '' : (rep === 'daily' ? 'daily' : 'weekly:' + el('td-wday').value);
  var dl = el('td-deadline').value;
  if (rule && dl && dl <= todayStr()) dl = nextOccDate(rule, dl);
  var note = el('td-note') ? el('td-note').value.trim() : '';
  var flow = el('td-flow') ? el('td-flow').value : '';
  var sid = parseInt(el('td-student').value);
  if (flow && !sid) { toast('选择工作流串联后需先在「关联学生」中选定学生（生成记录需要关联学生）', 'error'); return; }
  if (_tdEditId) {
    // —— 编辑已有待办 ——
    var t = null;
    for (var i = 0; i < DATA.todos.length; i++) if (DATA.todos[i].id === _tdEditId) { t = DATA.todos[i]; break; }
    if (!t) { toast('原任务不存在，可能已被删除', 'error'); return; }
    var oldFlow = t.flow || '', oldTitle = t.title, oldNote = t.note || '', oldSid = t.studentId;
    var wasDone = !!t.done, doneAt = t.doneAt || null;
    t.title = title; t.priority = el('td-priority').value; t.deadline = dl || todayStr();
    t.studentId = sid; t.rule = rule; t.ruleName = rule ? todoRuleName(rule) : '';
    t.note = note; t.attach = _tdAttach.slice(); t.flow = flow;
    if (wasDone) { t.done = true; t.doneAt = doneAt; }
    var linkedMsg = '';
    // 串联联动三态：
    // ① 原本无串联 → 本次新选 → 在对应模块生成记录（与新增一致）
    // ② 原本已串联且模块未变 → 同步学生/日期/标题到已有记录
    if (!oldFlow && flow) {
      addTodoFlowRecord(t);
      linkedMsg = '，并已在' + (flow === 'homework' ? '作业管理' : '家校沟通') + '生成一条记录';
    } else if (oldFlow && oldFlow === flow) {
      syncTodoLinked(t, oldTitle, oldNote, oldSid);
      linkedMsg = '，对应模块记录已联动同步';
    } else if (oldFlow && !flow) {
      linkedMsg = '（已解除串联，原生成的记录需到对应模块手动删除）';
    }
    _tdAttach = [];
    save(); closeModalForce(); renderPage();
    toast('任务已更新' + linkedMsg);
    return;
  }
  // —— 新增 ——
  var t2 = {
    id: uid(DATA.todos), title: title, priority: el('td-priority').value, deadline: dl || todayStr(),
    studentId: sid, done: false,
    rule: rule, ruleName: rule ? todoRuleName(rule) : '',
    note: note, attach: _tdAttach.slice(), flow: flow
  };
  DATA.todos.push(t2);
  _tdAttach = [];
  // —— 工作流串联：同步在对应模块生成一条记录 ——
  addTodoFlowRecord(t2);
  save(); closeModalForce(); renderPage();
  toast(rule ? '已添加常态化任务：' + todoRuleName(rule) : (flow ? '任务已添加，并已在' + (flow === 'homework' ? '作业管理' : '家校沟通') + '生成一条记录' : '任务已添加'));
}

// 待办编辑后，把 关联学生/日期/标题 联动同步到已生成的作业或沟通记录（不覆盖用户后补的科目/状态/结果/截图等）
function syncTodoLinked(t, oldTitle, oldNote, oldSid) {
  var oldAutoHwNote = oldTitle;            // 作业记录.note 原由待办标题自动生成
  var oldAutoComm = oldNote ? oldTitle + '\n' + oldNote : oldTitle;  // 沟通记录.content 原自动内容
  var newAutoComm = t.note ? t.title + '\n' + t.note : t.title;
  var oldParent = oldSid ? ((getStudent(oldSid) || {}).parentName || '') : '';
  var newParent = t.studentId ? ((getStudent(t.studentId) || {}).parentName || '') : '';
  if (t.flow === 'homework') {
    for (var i = 0; i < DATA.homework.length; i++) if (DATA.homework[i].fromTodo === t.id) {
      var h = DATA.homework[i];
      h.studentId = t.studentId; h.date = t.deadline;
      if (h.note === oldAutoHwNote) h.note = t.title;  // 备注仍为自动标题时同步，手工改过则不覆盖
    }
  } else if (t.flow === 'comm') {
    for (var j = 0; j < DATA.communications.length; j++) if (DATA.communications[j].fromTodo === t.id) {
      var c = DATA.communications[j];
      c.studentId = t.studentId; c.date = t.deadline;
      if (c.content === oldAutoComm) c.content = newAutoComm;   // 内容仍为自动生成时同步
      if (newParent && (!c.contact || (oldParent && c.contact === oldParent))) c.contact = newParent; // 联系人仍为旧档案家长/为空时同步
    }
  }
}

    }).join('') + '</div><div id="md-big" class="md-big"></div>';

        '<button class="btn btn-primary btn-sm" onclick="downloadTdFile(' + id + ',' + p[1] + ')">下载</button></div>';
    }).join('');
  } else h += '<div class="empty" style="padding:8px">无附件</div>';
  h += '</div><button class="btn btn-default" onclick="closeModalForce()">关闭</button></div>';
  openModal(h, 'lg');
}
function downloadTdFile(id, idx) {
  for (var i = 0; i < DATA.todos.length; i++) if (DATA.todos[i].id === id) {
    var att = DATA.todos[i].attach || [];
    var a = att[idx];
    if (!a) return;
    var nm = a.name || ('附件' + (idx + 1));
    if (a.data) { docTriggerDownload(a.data, nm); toast('正在下载附件'); return; }
    if (a.id) {
      mdGet(a.id).then(function(rec) {
        if (!rec || !rec.blob) { toast('图片已丢失', 'error'); return; }
        var u = URL.createObjectURL(rec.blob);
        docTriggerDownload(u, nm);
        setTimeout(function() { try { URL.revokeObjectURL(u); } catch (e) {} }, 60000);
      }).catch(function() { toast('读取图片失败', 'error'); });
    }
    return;
  }
}

function toggleTodo(id) {
  var t = DATA.todos.find(function(x) { return x.id === id; });
  if (!t) return;
  if (t.rule && !t.done) {
    // 常态化任务：本次完成 → 归档本次，并自动生成下一次
    DATA.todos.push({
      id: uid(DATA.todos), title: t.title, priority: t.priority, deadline: t.deadline,
      studentId: t.studentId, done: true, doneAt: todayStr(),
      rule: '', ruleName: t.ruleName, note: t.note || '', attach: t.attach ? t.attach.slice() : [], flow: t.flow || ''
    });
    var nd = nextOccDate(t.rule, t.deadline || todayStr());
    while (nd <= todayStr()) nd = nextOccDate(t.rule, nd);
    t.deadline = nd;
    t.done = false; t.doneAt = null;
    save(); renderPage();
    toast('本次已完成，已自动生成下一次（' + (t.ruleName || '常态化') + '，' + nd + '）');
    return;
  }
  t.done = !t.done;
  t.doneAt = t.done ? todayStr() : null;
  save(); renderPage();
}

function restoreTodo(id) {
  var t = DATA.todos.find(function(x) { return x.id === id; });
  if (!t) return;
  if (t.rule) { toast('常态化任务的本次记录不可单独恢复（下一次已自动生成），如需删除请点“删除”', 'warning'); return; }
  t.done = false; t.doneAt = null;
  save(); renderPage();
}

function restoreTodoDay(d) {
  var n = 0;
  DATA.todos.forEach(function(t) {
    if (t.done && !t.rule && (t.doneAt || (t.deadline && t.deadline <= todayStr() ? t.deadline : todayStr())) === d) {
      t.done = false; t.doneAt = null; n++;
    }
  });
  save(); renderPage(); toast('已恢复 ' + n + ' 项');
}

function deleteTodo(id) {
  var refs = [];
  for (var i = 0; i < DATA.todos.length; i++) if (DATA.todos[i].id === id) { refs = (DATA.todos[i].attach || []).map(attRef); break; }
  DATA.todos = DATA.todos.filter(function(t) { return t.id !== id; });
  mdDropRefs(refs);   // 无人引用的图片一并从图片库清理
  save(); renderPage();
}

//  读背过关（苏州中考学科 · 每日逐生逐科打卡 + 未完成记录）

var recBaseSubjects = ['语文', '数学', '英语', '物理', '化学', '道德与法治', '历史', '体育'];
var recCurDate = null;
var recActiveSub = '';

function recDefault() {
  return { subjects: recBaseSubjects.slice(), check: {}, logs: [] };
}
function normRecData() {
  if (!DATA.recitation || typeof DATA.recitation !== 'object') DATA.recitation = {};
  var r = DATA.recitation;
  if (!Array.isArray(r.subjects) || !r.subjects.length) r.subjects = recBaseSubjects.slice();
  if (!r.check || typeof r.check !== 'object') r.check = {};
  if (!Array.isArray(r.logs)) r.logs = [];
  return r;
}
function recDate() { return recCurDate || todayStr(); }
function recSetDate(v) { recCurDate = v || todayStr(); renderPage(); }
function recSetToday() { recCurDate = null; renderPage(); }
function recSetSubject(s) { recActiveSub = s; renderPage(); }
function recAddSubject() {
  var nm = prompt('输入要新增的学科名称（如：地理 生物 信息 音乐 等）', '');
  nm = (nm || '').trim();
  if (!nm) return;
  var r = normRecData();
  if (r.subjects.indexOf(nm) >= 0) { toast('该学科已存在', 'warning'); return; }
  r.subjects.push(nm);
  save(); renderPage(); toast('已添加学科：' + nm);
}
function recRemoveSubject(name) {
  var r = normRecData();
  if (r.subjects.length <= 1) { toast('至少保留一个学科', 'warning'); return; }
  if (!confirm('确定从列表移除学科「' + name + '」？历史打卡记录保留。')) return;
  r.subjects = r.subjects.filter(function(x) { return x !== name; });
  if (recActiveSub === name) recActiveSub = '';
  save(); renderPage();
}
function recCheckAll(checked) {
  var list = document.querySelectorAll('input[data-recid]');
  for (var i = 0; i < list.length; i++) list[i].checked = !!checked;
}
function recDoneMapOf(date, sub) {
  var r = normRecData();
  var cm = {};
  if (r.check && r.check[date] && r.check[date][sub]) cm = r.check[date][sub] || {};
  return cm;
}
function saveRecCheck() {
  var date = recDate();
  var sub = recActiveSub;
  if (!sub) sub = normRecData().subjects[0];
  var r = normRecData();
  if (!r.check[date]) r.check[date] = {};
  var cm = {};
  var els = document.querySelectorAll('input[data-recid]');
  for (var i = 0; i < els.length; i++) if (els[i].checked) cm[parseInt(els[i].getAttribute('data-recid'), 10)] = true;
  r.check[date][sub] = cm;
  // 同步未完成记录（同 日期+学科 只留一条，可反复修改）
  var undone = DATA.students.filter(function(s) { return !cm[s.id]; });
  r.logs = r.logs.filter(function(l) { return !(l.date === date && l.subject === sub); });
  if (undone.length) {
    r.logs.push({
      id: uid(r.logs), date: date, subject: sub,
      studentIds: undone.map(function(s) { return s.id; }),
      names: undone.map(function(s) { return s.name; }),
      count: undone.length, note: '', resolved: false, createdAt: todayStr()
    });
  }
  save(); renderPage();
  toast(undone.length ? '已保存：' + date + ' ' + sub + ' 未完成 ' + undone.length + ' 人（已记录，请安排补背）' : date + ' ' + sub + ' 全员完成 🎉');
}
function setRecLogNote(id, note) {
  var r = normRecData();
  var l = null;
  for (var i = 0; i < r.logs.length; i++) if (r.logs[i].id === id) { l = r.logs[i]; break; }
  if (l) { l.note = note; save(); }
}
function markRecLog(id) {
  var r = normRecData();
  for (var i = 0; i < r.logs.length; i++) if (r.logs[i].id === id) { r.logs[i].resolved = true; r.logs[i].resolvedAt = todayStr(); save(); renderPage(); toast('已标记为处理完成'); return; }
}
function unmarkRecLog(id) {
  var r = normRecData();
  for (var i = 0; i < r.logs.length; i++) if (r.logs[i].id === id) { r.logs[i].resolved = false; r.logs[i].resolvedAt = null; save(); renderPage(); return; }
}
function deleteRecLog(id) {
  if (!confirm('确定删除这条未完成记录？')) return;
  var r = normRecData();
  r.logs = r.logs.filter(function(l) { return l.id !== id; });
  save(); renderPage();
}
function exportRecLogs() {
  var r = normRecData();
  var rows = ['日期,学科,未完成学生,人数,处理状态,备注'];
  r.logs.slice().sort(function(a, b) { return (b.date || '').localeCompare(a.date || ''); }).forEach(function(l) {
    rows.push([l.date, l.subject, (l.names || []).join('、'), l.count || 0, l.resolved ? '已处理' : '未处理', l.note || ''].map(function(x) { return '"' + String(x).replace(/"/g, '""') + '"'; }).join(','));
  });
  var csv = '\ufeff' + rows.join('\n');
  var b = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = '读背未完成记录.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function() { URL.revokeObjectURL(a.href); }, 1000);
}
function recitationPane() {
  var r = normRecData();
  var date = recDate();
  var subs = r.subjects;
  if (subs.indexOf(recActiveSub) < 0) recActiveSub = subs[0];
  var sub = recActiveSub;

    '<button class="btn btn-default btn-sm" onclick="recSetToday()">今天</button></div>' +
    '<div class="book-tabs">';
  subs.forEach(function(s2) {

  html += '</div><div class="flex gap mt" style="align-items:center">' +
    '<button class="btn btn-default btn-sm" onclick="recAddSubject()">＋ 添加学科</button>' +
    '<span class="muted" style="font-size:12px">学科默认中考 8 科，可按需增删自定义</span></div></div>';

  // ② 当日该科打卡
  html += '<div class="card"><div class="card-title">② 打卡：' + esc(date) + ' · ' + esc(sub) + ' <span class="badge badge-success">已勾选 ' + Object.keys(cm).length + '/' + DATA.students.length + '</span></div>' +
    '<div class="flex gap mb"><button class="btn btn-default btn-sm" onclick="recCheckAll(true)">全选（都完成）</button>' +
    '<button class="btn btn-default btn-sm" onclick="recCheckAll(false)">全不选</button>' +
    '<button class="btn btn-primary btn-sm" onclick="saveRecCheck()">保存当日打卡</button></div>' +

  DATA.students.forEach(function(s) {
    var done = !!cm[s.id];
    html += '<tr><td><input type="checkbox" data-recid="' + s.id + '" ' + (done ? 'checked' : '') + ' style="width:20px;height:20px;cursor:pointer"></td>' +

  });
  html += '</tbody></table></div>' +
    '<p class="muted mt" style="font-size:12px">说明：保存后系统把当前未勾选的学生记为今日“' + esc(sub) + '”未完成，若之后补背完成，可再次勾选并保存，该条未完成记录会自动更新/消除。</p></div>';

  // ③ 未完成记录
  html += '<div class="card"><div class="card-title">🗂 未完成记录 <span class="badge badge-warning">' + logs.filter(function(l) { return !l.resolved; }).length + ' 条待处理</span>' +
    ' <button class="btn btn-default btn-sm" onclick="exportRecLogs()" style="float:right">导出CSV</button></div>';
  if (logs.length) {
    logs.forEach(function(l) {
      var res = !!l.resolved;
      html += '<div style="border:1px solid ' + (res ? 'var(--border,#e5e7eb)' : '#ffd591') + ';border-radius:10px;padding:8px 10px;margin:8px 0;' + (res ? 'opacity:.65' : 'background:#fffdf5') + '">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><b>' + esc(l.date) + ' · ' + esc(l.subject) + '</b>' +
        '<span class="badge ' + (res ? 'badge-success' : 'badge-danger') + '">' + (res ? '已处理' : '未处理 ' + (l.count || l.names.length) + ' 人') + '</span></div>' +
        '<div style="margin:6px 0;line-height:1.8">' + (l.names || []).map(function(n) { return '<span class="badge badge-info" style="margin-right:4px">' + esc(n) + '</span>'; }).join('') + '</div>' +

        '<button class="btn ' + (res ? 'btn-default' : 'btn-success') + ' btn-sm" onclick="' + (res ? 'unmarkRecLog' : 'markRecLog') + '(' + l.id + ')">' + (res ? '恢复待处理' : '标记已处理') + '</button>' +
        '<button class="btn btn-danger btn-sm" onclick="deleteRecLog(' + l.id + ')">删除</button></div>' +
        (res && l.resolvedAt ? '<div style="font-size:12px;color:#888;margin-top:4px">处理时间：' + esc(l.resolvedAt) + '</div>' : '') +

    });
  } else html += '<div class="empty">暂无未完成记录 🎉（有未勾选学生并保存后会自动出现）</div>';
  html += '</div>';
  return html;
};

var _siteMgr = false;
function toggleSiteMgr() { _siteMgr = !_siteMgr; renderPage(); }
function siteById(id) {
  var sites = (DATA.teaching && DATA.teaching.sites) || [];
  for (var i = 0; i < sites.length; i++) if (sites[i].id === id) return sites[i];
  return null;
}
function showSiteForm(id) {
  var s = id ? siteById(id) : null;
  openModal('<div class="modal-header"><h3>' + (s ? '编辑网站' : '添加网站') + '</h3><button class="modal-close" onclick="closeModalForce()">&times;</button></div>' +
    '<div class="modal-body">' +
    '<div class="form-group"><label>网站名称 *</label><input id="ts-name" value="' + esc(s ? s.name : '') + '" placeholder="如：国家中小学智慧教育平台"></div>' +
    '<div class="form-group"><label>网址 URL *</label><input id="ts-url" value="' + esc(s ? s.url : '') + '" placeholder="如：https://www.zxx.edu.cn"></div>' +
    '<div class="form-row">' +
    '<div class="form-group"><label>图标（emoji / 字母，可留空）</label><input id="ts-icon" value="' + esc(s ? (s.icon || '') : '') + '" placeholder="🌐" maxlength="4"></div>' +
    '<div class="form-group"><label>说明（选填）</label><input id="ts-desc" value="' + esc(s ? (s.desc || '') : '') + '" placeholder="一句话介绍"></div>' +
    '</div>' +
    '<div style="text-align:right;margin-top:6px"><button class="btn btn-primary" onclick="saveSiteForm(' + (s ? s.id : 0) + ')">保存</button> ' +
    '<button class="btn btn-default" onclick="closeModalForce()">取消</button></div></div>');
}
function saveSiteForm(id) {
  var name = el('ts-name').value.trim();
  var url = el('ts-url').value.trim();
  var icon = el('ts-icon').value.trim();
  var desc = el('ts-desc').value.trim();
  if (!name) { toast('请填写网站名称', 'error'); return; }
  if (!url) { toast('请填写网址', 'error'); return; }
  if (!/^[a-zA-Z][a-zA-Z0-9+.\-]*:\/\//.test(url)) url = 'https://' + url;
  if (!icon) icon = '🌐';
  if (id) {
    var s = siteById(id);
    if (s) { s.name = name; s.url = url; s.icon = icon; s.desc = desc; }
  } else {
    DATA.teaching.sites.push({ id: uid(DATA.teaching.sites), name: name, url: url, icon: icon, desc: desc });
  }
  save(); closeModalForce(); renderPage(); toast(id ? '网站已更新' : '网站已添加');
}
function deleteSite(id) {
  var s = siteById(id);
  if (!s) return;
  if (!confirm('确定删除网站「' + s.name + '」？')) return;
  DATA.teaching.sites = DATA.teaching.sites.filter(function(x) { return x.id !== id; });
  save(); renderPage();
}
function teachingResetSites() {
  if (!confirm('将常用教学网站重置为内置默认列表？您手动添加的网站将被移除。')) return;
  DATA.teaching.sites = seedSites();
  save(); renderPage(); toast('已恢复为内置默认网站');
}

function showFolderForm(id) {
  var f = id ? folderById(id) : null;
  openModal('<div class="modal-header"><h3>' + (f ? '编辑文件夹' : '添加文件夹') + '</h3><button class="modal-close" onclick="closeModalForce()">&times;</button></div>' +
    '<div class="modal-body">' +
    '<div class="form-group"><label>名称 *</label><input id="fs-name" value="' + esc(f ? f.name : '') + '" placeholder="如：党务工作"></div>' +
    '<div class="form-group"><label>文件夹路径 *（本机或共享）</label><input id="fs-path" value="' + esc(f ? f.path : '') + '" placeholder="如：C:\\Users\\Lenovo\\Desktop\\党务工作"></div>' +
    '<p class="muted" style="font-size:12px;margin:0 0 8px">💡 快速获取路径：在文件夹上按住 Shift 键点右键 → 「复制为路径」→ 粘贴到这里。</p>' +

    '<button class="btn btn-default" onclick="closeModalForce()">取消</button></div></div>');
}
function saveFolderForm(id) {
  var name = el('fs-name').value.trim();
  var path = el('fs-path').value.trim();
  if (!path) { toast('请填写文件夹路径', 'error'); return; }
  if (!/^[a-zA-Z]:[\\/]/.test(path) && !/^\\\\/.test(path) && !/^\\\//.test(path)) {
    toast('路径格式不正确：请填本机路径（如 C:\\xxx）或共享路径（如 \\\\服务器\\共享）', 'error'); return;
  }
  if (!name) {
    var segs = path.replace(/[\\/]+$/, '').split(/[\\/]/);
    name = segs[segs.length - 1] || ('文件夹' + (new Date()).getTime());
  }

// ---------- IndexedDB 文件库（浏览器本地数据库） ----------
var DOC_IDB_NAME = 'wb_workbench_files';
var DOC_IDB_STORE = 'files';
var _docDb = null, _docDbFail = false, _docDbOpening = null;

function docIdbOpen() {
  if (_docDb) return Promise.resolve(_docDb);
  if (_docDbFail) return Promise.reject(new Error('idb-unavailable'));
  if (_docDbOpening) return _docDbOpening;
  _docDbOpening = new Promise(function(resolve, reject) {
    var done = false;
    function fail(err) {
      if (done) return; done = true; _docDbFail = true;
      reject(err || new Error('idb-error'));
    }
    try {
      if (!window.indexedDB) { fail(new Error('idb-unsupported')); return; }
      var req = indexedDB.open(DOC_IDB_NAME, 1);
      var timer = setTimeout(function() { fail(new Error('idb-timeout')); }, 4000);
      req.onupgradeneeded = function(e) {
        var idb = e.target.result;
        if (!idb.objectStoreNames.contains(DOC_IDB_STORE)) idb.createObjectStore(DOC_IDB_STORE, { keyPath: 'id' });
      };
      req.onsuccess = function(e) { if (done) return; done = true; clearTimeout(timer); _docDb = e.target.result; resolve(_docDb); };
      req.onerror = function() { clearTimeout(timer); fail(req.error); };
      req.onblocked = function() { clearTimeout(timer); fail(new Error('idb-blocked')); };
    } catch (err) { fail(err); }
  });
  return _docDbOpening;
}

function docIdbTx(mode, fn) {
  return docIdbOpen().then(function(idb) {
    return new Promise(function(resolve, reject) {
      var tx, store, out;
      try {
        tx = idb.transaction(DOC_IDB_STORE, mode);
        store = tx.objectStore(DOC_IDB_STORE);
        out = fn(store);
      } catch (err) { reject(err); return; }
      tx.oncomplete = function() {
        var v;
        if (out && typeof out === 'object' && 'result' in out) { try { v = out.result; } catch (e) { v = undefined; } }
        resolve(v);
      };
      tx.onerror = function() { reject(tx.error || new Error('idb-tx')); };
      tx.onabort = function() { reject(tx.error || new Error('idb-abort')); };
    });
  });
}
function docIdbPut(rec) { return docIdbTx('readwrite', function(s) { s.put(rec); }); }
function docIdbGet(id) { return docIdbTx('readonly', function(s) { return s.get(id); }).then(function(r) { return r || null; }); }
function docIdbDel(id) { return docIdbTx('readwrite', function(s) { s.delete(id); }); }
function docIdbDelMany(ids) {
  if (!ids || !ids.length) return Promise.resolve();
  return docIdbTx('readwrite', function(s) { ids.forEach(function(i) { s.delete(i); }); });
}

// 写入前预检剩余配额（拿不到配额信息时按可用处理）
function docIdbHasRoom(need) {
  if (!navigator.storage || !navigator.storage.estimate) return Promise.resolve(true);
  return navigator.storage.estimate().then(function(est) {
    if (!est || !est.quota) return true;
    return (est.usage || 0) + need < est.quota * 0.9;
  }).catch(function() { return true; });
}
// dataURL(base64) → Blob，用于把旧版数据迁移进文件库
function docDataUrlToBlob(dataUrl) {
  var s = String(dataUrl || ''), comma = s.indexOf(',');
  if (comma < 0) return null;
  var head = s.slice(0, comma), body = s.slice(comma + 1);
  var m = /:(.*?);/.exec(head);
  var mime = m ? m[1] : 'application/octet-stream';
  var bin;
  try { bin = atob(body); } catch (e) { return null; }
  var u8 = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return new Blob([u8], { type: mime });
}

// 旧数据迁移：把 items 里的 base64 文件搬进 IndexedDB 文件库，迁移后释放本地存储空间
function migrateDocFilesToIdb() {
  var items = (DATA.docs && DATA.docs.items) || [];
  var legacy = items.filter(function(x) { return x.kind === 'file' && x.fileData; });
  if (!legacy.length) return Promise.resolve(0);
  var okCount = 0;
  var chain = legacy.reduce(function(p, it) {
    return p.then(function() {

// ---------- IndexedDB 图片库（粘贴 / 上传的截图统一存这里，不挤占本地存储） ----------
var MEDIA_IDB_NAME = 'wb_workbench_media';
var MEDIA_IDB_STORE = 'imgs';

      req.onupgradeneeded = function(e) {

        if (!idb.objectStoreNames.contains(MEDIA_IDB_STORE)) idb.createObjectStore(MEDIA_IDB_STORE, { keyPath: 'id' });
      };

function mdIsDirect(v) {

// 压缩后写入图片库；图片库不可用时自动回退为 base64（功能不受影响）
function mdAddImage(file, cb) {

    var blob = docDataUrlToBlob(dataUrl);

    function toCloud(fallbackRef) {
      if (!wbCloud.ready) { cb(fallbackRef, null); return; }

        if (fallbackRef === id) { mdForget(id); mdDelMany([id]).catch(function() {}); }

    fileType: docTypeName(ext), fileName: f.name, fileSize: f.size, created: todayStr(), store: 'idb' };

  docIdbHasRoom(f.size).then(function(room) {
    if (!room) throw new Error('no-room');
    return docIdbPut({ id: id, blob: f, name: f.name, type: f.type || '', size: f.size, catId: c.id, created: meta.created });
  }).then(function() {

    closeModalForce(); renderPage();
    toast('已存入文件库：' + f.name + '（' + fmtBytes(f.size) + '）');
  }).catch(function(err) {

// 兼容模式回退：base64 存入浏览器本地存储（受单文件与合计上限约束）
function storeDocFileFallback(f, c, ext, id) {
  if (f.size > DOC_MAX_FILE_FALLBACK) {
    toast('本机数据库不可用，已切换兼容模式：该模式下单个文件不能超过 ' + fmtBytes(DOC_MAX_FILE_FALLBACK), 'error');
    return;
  }
  if (docStoredBytes() + f.size > DOC_TOTAL_LIMIT) {
    toast('兼容模式容量将超限（上限 ' + fmtBytes(DOC_TOTAL_LIMIT) + '），请先删除部分旧文件', 'error');
    return;
  }
  var reader = new FileReader();
  reader.onload = function(e) {
    var item = { id: id, catId: c.id, kind: 'file', title: f.name, fileExt: ext,
      fileType: docTypeName(ext), fileName: f.name, fileSize: f.size, fileData: e.target.result, created: todayStr(), store: 'local' };
    DATA.docs.items.push(item);
    try {
      save();
      closeModalForce(); renderPage();
      toast('已保存：' + f.name + '（兼容模式）');
    } catch (err) {
      DATA.docs.items = DATA.docs.items.filter(function(x) { return x !== item; });
      toast('保存失败：本地存储空间不足，请删除部分旧文件后重试', 'error');
    }
  };
  reader.onerror = function() { toast('文件读取失败', 'error'); };
  reader.readAsDataURL(f);
}

// ============================================================
//  初始化
// ============================================================
// ============================================================
//  云端同步（多设备共享同一份数据）
//  ------------------------------------------------------------
//  · 探测不到资料库 SDK 时（例如本地双击 file:// 打开），本篇逻辑完全不生效，
//    工作台照旧走单机 localStorage，功能一点不受影响。
//  · 整份数据按顶层模块切成若干「分片」，每片一条记录；年级考试再按每场考试
//    单独成片，避免单条记录越滚越大。
//  · 拉取时逐片比时间：只有云端更新的分片才覆盖本地——别的设备改了「待办」，
//    不会冲掉这边刚录的「成绩」。
//  · 截图上传云端图床换取地址，任何登录同一账号的设备都能看到。
// ============================================================
var DATABASE_ID = 'Wenl2fZoHICdFby2xJ559w';
var WB_META_KEY = 'banzhuren_cloud_meta';
var WB_PUSH_DELAY = 1500;
var WB_S_PREFIX = 's:';
var WB_GX_PREFIX = 'gx:';
var WB_GMETA_KEY = 'gmeta';
var WB_IMG_TYPES = ['image/png', 'image/jpeg', 'image/gif', 'image/webp', 'image/bmp', 'image/svg+xml', 'image/heic', 'image/heif', 'image/tiff'];
// 「工作台云数据」表的四个字段名（建表返回的真实字段，不可臆造）
var WB_KEY_FIELD = '分片键', WB_BODY_FIELD = '内容', WB_TS_FIELD = '更新时间', WB_DEV_FIELD = '设备';

// ============================================================
// 云同步传输层
//   把「同步什么」（分片与合并逻辑）和「同步到哪」拆开，三种通道共用同一套上层逻辑：
//     sp   —— WorkBuddy 在线 page 注入的数据表（仅在 workbuddy.link 环境可用）
//     self —— 自建 Cloudflare Worker + KV（GitHub Pages 等任意静态托管都能用）
//     off  —— 单机模式，只写本机浏览器存储
//   统一接口：pullAll(known) / upsert(items) / wipeAll() / uploadImage(b64,ct) / subscribe(cb)
// ============================================================
var WB_SELF_KEY = 'banzhuren_cloud_self';
var WB_SELF_POLL_MS = 30000;

function wbSelfCfg() {
  try {
    var o = JSON.parse(localStorage.getItem(WB_SELF_KEY) || '{}') || {};
    return {
      url: String(o.url || '').trim().replace(/\/+$/, ''),
      key: String(o.key || '')
    };
  } catch (e) { return { url: '', key: '' }; }
}
function wbSelfSave(url, key) {
  try {
    localStorage.setItem(WB_SELF_KEY, JSON.stringify({
      url: String(url || '').trim().replace(/\/+$/, ''),
      key: String(key || '')
    }));
  } catch (e) {}
}
function wbSelfClear() { try { localStorage.removeItem(WB_SELF_KEY); } catch (e) {} }

// ---- 通道一：WorkBuddy 在线 page 的数据表 ----
function wbTransSP() {
  var db = window.__SMART_PAGE__.database;
  var recIds = {};
  var t = { kind: 'sp', ready: true };

  t.pullAll = function() {
    var acc = [], guard = 0;
    function step(cursor) {
      return db.query({ databaseId: DATABASE_ID, pageSize: 200, startCursor: cursor }).then(function(r) {
        var rows = (r && r.results) || [];
        acc = acc.concat(rows);
        var next = r && r.nextCursor;
        if (r && r.hasMore && next && next !== cursor && rows.length && guard < 100) { guard++; return step(next); }
        return acc;
      });
    }
    return step(undefined).then(function(recs) {
      var map = {}, ts = {}, ids = {};
      (recs || []).forEach(function(rec) {
        if (!rec) return;
        var k = rec[WB_KEY_FIELD];
        if (typeof k !== 'string' || !k) return;
        map[k] = rec[WB_BODY_FIELD];
        ts[k] = wbCloudParseTs(rec[WB_TS_FIELD]);
        ids[k] = rec._id || '';
      });
      recIds = ids;
      return { map: map, ts: ts, ids: ids, count: (recs || []).length };
    });
  };

  t.upsert = function(items) {
    var res = { ok: [], stale: [], failed: [] };
    var chain = Promise.resolve();
    items.forEach(function(it) {
      chain = chain.then(function() {
        var props = {};
        props[WB_KEY_FIELD] = { text: it.key };
        props[WB_BODY_FIELD] = { text: it.body };
        props[WB_TS_FIELD] = { date: it.ts };
        props[WB_DEV_FIELD] = { text: it.dev };
        var rid = recIds[it.key];
        var p = rid
          ? db.updateRecord({ databaseId: DATABASE_ID, recordId: rid, properties: props })
          : db.addRecord({ databaseId: DATABASE_ID, properties: props }).then(function(r) {
              var nid = r && (r.id || r._id);
              if (nid) recIds[it.key] = nid;
            });
        return p.then(function() { res.ok.push(it.key); }).catch(function() { res.failed.push(it.key); });
      });
    });
    return chain.then(function() { return res; });
  };

  t.wipeAll = function() {
    return t.pullAll().then(function(r) {
      var ids = Object.keys(r.ids).map(function(k) { return r.ids[k]; }).filter(Boolean);
      var chain = Promise.resolve();
      ids.forEach(function(rid) {
        chain = chain.then(function() { return db.deleteRecord({ databaseId: DATABASE_ID, recordId: rid }).catch(function() {}); });
      });
      return chain.then(function() { recIds = {}; return { deleted: ids.length }; });
    });
  };

  t.uploadImage = function(b64, ct) {
    return db.uploadImage({ data: b64, contentType: ct, fileName: '截图.jpg' }).then(function(r) {
      if (!r || !r.url) throw new Error('no-url');
      return r.url;
    });
  };

  t.subscribe = function(cb) {
    if (typeof db.onUpdated !== 'function') return;
    db.onUpdated(cb);
  };

  return t;
}

// ---- 通道二：自建 Cloudflare Worker + KV ----
function wbTransSelf(cfg) {
  var t = { kind: 'self', ready: true, url: cfg.url, poll: null };

  function call(path, body) {
    return fetch(cfg.url + '/api' + path, {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-wb-key': cfg.key },
      body: JSON.stringify(body || {})
    }).then(function(r) {
      return r.text().then(function(txt) {
        var j = null;
        try { j = JSON.parse(txt); } catch (e) {}
        if (!r.ok || !j || j.ok !== true) {
          var err = new Error((j && j.error) || ('HTTP ' + r.status));
          err.status = r.status;
          throw err;
        }
        return j;
      });
    });
  }

  t.ping = function() { return call('/ping', {}); };
  t.pullAll = function(known) {
    return call('/pull', { known: known || {} }).then(function(j) {
      return { map: j.map || {}, ts: j.ts || {}, ids: {}, count: j.count || 0 };
    });
  };
  t.upsert = function(items) {
    return call('/push', { items: items }).then(function(j) {
      return { ok: j.okKeys || [], stale: j.stale || [], failed: j.failed || [] };
    });
  };
  t.wipeAll = function() {
    return call('/wipe', {}).then(function(j) { return { deleted: j.deleted || 0 }; });
  };
  t.uploadImage = function(b64, ct) {
    return call('/img', { data: b64, contentType: ct }).then(function(j) {
      if (!j.url) throw new Error('no-url');
      return j.url;
    });
  };
  // 自建后端没有推送通道，改用定时轮询；只在页面可见时拉，切回页面立刻拉一次
  t.subscribe = function(cb) {
    if (t.poll) clearInterval(t.poll);
    t.poll = setInterval(function() { if (!document.hidden) cb(); }, WB_SELF_POLL_MS);
    document.addEventListener('visibilitychange', function() { if (!document.hidden) cb(); });
  };

  return t;
}

// 按当前环境挑一条通道：优先 WorkBuddy 数据表，其次自建后端，都没有就单机
function wbTransPick() {
  if (wbCloudEnabled()) return wbTransSP();
  var cfg = wbSelfCfg();
  if (cfg.url && cfg.key) {
    try { return wbTransSelf(cfg); } catch (e) {}

  return { kind: 'off', ready: false };
}

}
function wbCloudMeta() {
  try { return JSON.parse(localStorage.getItem(WB_META_KEY) || '{}') || {}; } catch (e) { return {}; }
}
function wbCloudSetMeta(m) {
  try { localStorage.setItem(WB_META_KEY, JSON.stringify(m || {})); } catch (e) {}
}
function wbCloudClearMeta() {
  try { localStorage.removeItem(WB_META_KEY); } catch (e) {}
}
function wbCloudNowIso() { return new Date().toISOString(); }
function wbCloudParseTs(v) {
  if (!v) return 0;
  if (typeof v === 'number') return v;
  var t = Date.parse(v);
  return isNaN(t) ? 0 : t;
}
// 状态指示器：文案派生自云端数据表，按要求标注 database 绑定
function wbCloudPaint(state, extra) {
  wbCloud.state = state;
  var chip = el('wb-cloud-chip');
  if (!chip) return;
  var label = ({ off: '单机模式', idle: '云端已连接', syncing: '同步中…', ok: '云端已同步', err: '云端同步失败', empty: '云端暂无数据' })[state] || '单机模式';
  chip.textContent = extra ? label + ' · ' + extra : label;
  chip.className = 'wb-cloud-chip wb-cloud-' + state;
  chip.title = extra ? label + '（' + extra + '）' : label;
  chip.setAttribute('data-sp-bindable', 'database');
  chip.setAttribute('data-sp-database-id', DATABASE_ID);
}
// 把 DATA 切成 分片键 -> JSON 字符串
function wbShardsFrom(data) {
  var out = {}, k, g, meta = {}, exs = [], order = [];
  data = data || {};
  for (k in data) {
    if (!Object.prototype.hasOwnProperty.call(data, k)) continue;
    if (data[k] === undefined) continue;
    if (k === 'grade') continue;
    out[WB_S_PREFIX + k] = JSON.stringify(data[k]);
  }
  g = data.grade || {};
  for (k in g) {
    if (!Object.prototype.hasOwnProperty.call(g, k)) continue;
    if (k === 'exams') { exs = g.exams || []; continue; }
    meta[k] = g[k];
  }
  (exs || []).forEach(function(ex) {
    if (!ex || ex.id === undefined || ex.id === null) return;
    order.push(ex.id);
    out[WB_GX_PREFIX + ex.id] = JSON.stringify(ex);
  });
  out[WB_GMETA_KEY] = JSON.stringify({ rest: meta, order: order });
  return out;
}
// 把单个分片写回 DATA（就地合并，不认识的键原样保留）
function wbApplyShard(data, key, val) {
  var g, rest, i, id, found;
  if (key === WB_GMETA_KEY) {
    g = data.grade || (data.grade = {});
    rest = (val && val.rest) || {};
    for (var rk in rest) if (Object.prototype.hasOwnProperty.call(rest, rk)) g[rk] = rest[rk];
    return;
  }
  if (key.indexOf(WB_GX_PREFIX) === 0) {
    g = data.grade || (data.grade = {});
    if (!g.exams) g.exams = [];
    id = String(key.slice(WB_GX_PREFIX.length));
    found = -1;
    for (i = 0; i < g.exams.length; i++) {
      if (g.exams[i] && String(g.exams[i].id) === id) { found = i; break; }
    }
    if (found >= 0) g.exams[found] = val; else g.exams.push(val);
    return;
  }
  if (key.indexOf(WB_S_PREFIX) === 0) data[key.slice(WB_S_PREFIX.length)] = val;
}
// 按 meta 分片里的顺序重排年级考试
function wbOrderGradeExams(val) {
  var order = (val && val.order) || [];
  var g = DATA.grade || (DATA.grade = {});
  var exams = g.exams || [];
  if (!order.length || exams.length < 2) return;
  var byId = {}, i, out = [];
  for (i = 0; i < exams.length; i++) if (exams[i]) byId[String(exams[i].id)] = exams[i];
  for (i = 0; i < order.length; i++) {
    var e = byId[String(order[i])];
    if (e) { out.push(e); delete byId[String(order[i])]; }
  }
  for (i = 0; i < exams.length; i++) {
    if (exams[i] && byId[String(exams[i].id)]) out.push(exams[i]);
  }
  if (out.length === exams.length) g.exams = out;
}
// 读取云端全部分片 → { map, ts, ids, count }
// 传入本机已知的云端时间戳，自建通道只回传有变动的分片正文，省流量
function wbCloudFetch() {
  if (!wbTransport.ready) return Promise.resolve({ map: {}, ts: {}, ids: {}, count: 0 });
  return wbTransport.pullAll(wbCloudMeta().shards || {});
}

function wbCloudLooksReal() {
  return !!(DATA && DATA.students && DATA.students.length > 0 && !isSampleData());
}
// 拉取云端并合并；opts.reason: 'boot' | 'remote' | 'manual'
function wbCloudPull(opts) {
  opts = opts || {};
  if (!wbCloud.ready || wbCloud.busy) return Promise.resolve(false);
  wbCloud.busy = true;
  // 轮询是背景行为，不闪「同步中…」，免得每 30 秒晃一下
  if (opts.reason !== 'boot' && opts.reason !== 'poll') wbCloudPaint('syncing');
  return wbCloudFetch().then(function(res) {
    wbCloud.recIds = res.ids;
    wbCloud.lastShards = res.map;
    wbCloud.synced = true;
    var meta = wbCloudMeta();
    meta.shards = meta.shards || {};
    var localShards = wbShardsFrom(DATA);
    var applied = 0, key, cts, lts;

    for (key in res.map) {
      if (!Object.prototype.hasOwnProperty.call(res.map, key)) continue;
      cts = res.ts[key] || 0;
      lts = meta.shards[key] || 0;
      if (cts > lts) {
        var val = null;
        try { val = JSON.parse(res.map[key]); } catch (e) { val = undefined; }
        // 年级考试分片只认服务端为最新的分片，避免把本地更新覆盖掉
        if (val === undefined) continue;
        if (key === WB_GMETA_KEY) wbOrderGradeExams(val);
        wbCloud.applying = true;
        try { wbApplyShard(DATA, key, val); } finally { wbCloud.applying = false; }
        meta.shards[key] = cts;
        applied++;
      }
    }
    wbCloud.busy = false;
    if (applied) {
      wbCloudSetMeta(meta);
      try { save(); } catch (e) {}
      try { renderPage(); } catch (e) {}
      wbCloud.lastSync = fmtDateTime(Date.now());
      wbCloudPaint('ok', wbCloud.lastSync);
      if (opts.reason === 'remote') toast('检测到其他设备的更新，已同步');
      return true;
    }
    if (!res.count) {
      // 云端还是空的：本机有真实数据才询问是否上传，避免把示例班推上去
      if (wbCloudLooksReal()) {
        var m2 = wbCloudMeta();
        if (!m2.noUpload) {
          if (!m2.askedUpload) { m2.askedUpload = true; wbCloudSetMeta(m2); }
          if (confirm('云端还没有数据。要把本机现有数据上传到云端，让手机和其他电脑都能看到吗？')) {
            wbCloud.lastShards = {};
            wbCloudPush(true);
            return true;
          }
          m2 = wbCloudMeta(); m2.noUpload = true; wbCloudSetMeta(m2);
        }
      }
      wbCloudPaint('empty');
      return false;
    }
    wbCloud.lastSync = fmtDateTime(Date.now());
    wbCloudPaint('ok', wbCloud.lastSync);
    return false;
  }).catch(function() {
    wbCloud.busy = false;
    wbCloudPaint('err', '网络或权限异常');
    return false;
  });
}
// 有改动就排一次推送（节流）
function wbCloudSchedulePush() {
  if (!wbCloud.ready || wbCloud.applying) return;
  wbCloud.dirty = true;
  if (wbCloud.timer) clearTimeout(wbCloud.timer);
  wbCloud.timer = setTimeout(function() { wbCloud.timer = null; wbCloudPush(); }, WB_PUSH_DELAY);
}
function wbCloudPush(force) {
  if (!wbCloud.ready) return Promise.resolve();
  if (wbCloud.busy) { wbCloud.dirty = true; return Promise.resolve(); }
  if (!force && !wbCloud.synced) return Promise.resolve();   // 没成功拉过就不推，避免把云端覆盖掉
  if (!force && wbCloudMeta().noUpload) return Promise.resolve();
  if (!wbCloudLooksReal() && !force) return Promise.resolve();
  wbCloud.dirty = false;
  var shards = wbShardsFrom(DATA);
  var changed = [];
  Object.keys(shards).forEach(function(k) {
    if (shards[k] !== wbCloud.lastShards[k]) changed.push(k);
  });
  if (!changed.length) { wbCloudPaint('ok', wbCloud.lastSync); return Promise.resolve(); }
  wbCloud.busy = true;
  wbCloudPaint('syncing');
  var ts = wbCloudNowIso(), dev = wbCloudDevice();
  var meta = wbCloudMeta();
  meta.shards = meta.shards || {};
  var metaTs = Date.now();
  var items = changed.map(function(k) { return { key: k, body: shards[k], ts: ts, dev: dev }; });
  return wbTransport.upsert(items).then(function(res) {
    var oks = (res && res.ok) || [];
    oks.forEach(function(k) { wbCloud.lastShards[k] = shards[k]; meta.shards[k] = metaTs; });
    wbCloudSetMeta(meta);
    wbCloud.busy = false;
    wbCloud.lastSync = fmtDateTime(Date.now());
    var failed = (res && res.failed) || [];
    var stale = (res && res.stale) || [];
    if (failed.length) {
      wbCloudPaint('err', failed.length + ' 个分片未同步');
      wbCloud.dirty = true;
    } else if (stale.length) {
      // 云端那几片比本机新（别的设备刚改过）→ 本机这份作废，立刻取回最新的
      wbCloudPaint('idle', '其他设备刚改过，正在取回');
      wbCloudPull({ reason: 'remote' });
    } else {
      wbCloudPaint('ok', wbCloud.lastSync);
    }
  }).catch(function() {
    wbCloud.busy = false;
    wbCloudPaint('err', '网络或权限异常');
  });
}
// 别的设备改了 → 自动拉一次（整页只注册一次）
function wbCloudSubscribe() {
  if (!wbTransport.ready || typeof wbTransport.subscribe !== 'function') return;
  wbTransport.subscribe(function(payload) {
    var reason = 'poll';
    if (wbTransport.kind === 'sp') {
      var ids = (payload && payload.databaseIds) || [];
      if (ids.indexOf(DATABASE_ID) === -1) return;
      reason = 'remote';   // 数据表是推送式的，算「远端有更新」
    }
    if (wbCloud.applying) return;
    if (wbCloud.upTimer) clearTimeout(wbCloud.upTimer);
    wbCloud.upTimer = setTimeout(function() {
      wbCloud.upTimer = null;
      if (wbCloud.busy) { wbCloud.upTimer = setTimeout(function() { wbCloud.upTimer = null; wbCloudPull({ reason: reason }); }, 800); return; }
      wbCloudPull({ reason: reason });
    }, 400);
  });
}
// 截图上传云端，换取可跨设备访问的地址
function wbCloudUploadImage(dataUrl, cb) {
  var s = String(dataUrl || ''), comma = s.indexOf(',');
  if (comma < 0) { cb(null, '图片格式异常'); return; }
  var head = s.slice(0, comma), b64 = s.slice(comma + 1);
  var mt = /data:([^;]+)/.exec(head);
  var ct = (mt && mt[1] ? mt[1] : 'image/jpeg').toLowerCase();
  if (WB_IMG_TYPES.indexOf(ct) < 0) ct = 'image/jpeg';
  if (Math.floor(b64.length * 3 / 4) > 10 * 1024 * 1024) { cb(null, '图片超过 10MB'); return; }
  if (!wbTransport.ready || typeof wbTransport.uploadImage !== 'function') { cb(null, '当前未启用云同步'); return; }
  wbTransport.uploadImage(b64, ct).then(function(url) {
    if (!url) throw new Error('no-url');
    cb(url, null);
  }).catch(function() { cb(null, '云端上传失败'); });
}
// 本地图片（含历史遗留的）补传云端：把图片 id 换成云端地址
function wbCloudBackfillImages() {
  if (!wbCloud.ready) return Promise.resolve(0);
  var jobs = [];
  (DATA.communications || []).forEach(function(c) {
    (c.images || []).forEach(function(v, i) {
      if (v && !mdIsDirect(v)) jobs.push({ get: function() { return v; }, set: function(nv) { c.images[i] = nv; } });
    });
  });
  (DATA.todos || []).forEach(function(t) {
    (t.attach || []).forEach(function(a) {
      if (a && attIsImg(a) && a.id && !mdIsDirect(a.id)) jobs.push({ get: function() { return a.id; }, set: function(nv) { a.id = ''; a.data = nv; } });
    });
  });
  if (!jobs.length) return Promise.resolve(0);
  var n = 0;
  return jobs.reduce(function(p, j) {
    return p.then(function() {
      var ref = j.get();
      return mdGet(ref).then(function(rec) {
        if (!rec || !rec.blob) return null;
        return blobToDataUrl(rec.blob).then(function(du) {
          if (!du) return null;
          return new Promise(function(resolve) {
            wbCloudUploadImage(du, function(url) {
              if (url) { j.set(url); n++; mdForget(ref); mdDelMany([ref]).catch(function() {}); }
              resolve(null);
            });
          });
        });
      }).catch(function() { return null; });
    });
  }, Promise.resolve()).then(function() {
    if (n) { try { save(); } catch (e) {} }
    return n;
  }).catch(function() { return n; });
}
function wbCloudInit() {
  wbTransport = wbTransPick();
  if (!wbTransport.ready) { wbCloudPaint('off'); wbCloud.booted = true; return; }
  wbCloud.ready = true;
  wbCloud.booted = true;
  wbCloudPaint('idle');
  wbCloudSubscribe();
  wbCloudPull({ reason: 'boot' }).then(function() {
    return wbCloudBackfillImages();
  }).then(function(n) {
    if (n > 0) {
      toast('已将 ' + n + ' 张本机截图上传到云端，其他设备也能看了');
      if (currentPage === 'communication' || currentPage === 'todo') renderPage();
    }
    if (wbCloud.dirty) wbCloudPush();
  }).catch(function() {});
}
// 清空云端（跟随「清空全部数据」一起执行，保证各设备看到的一致）
function wbCloudWipe() {
  if (!wbTransport.ready) { wbCloudClearMeta(); return Promise.resolve(); }
  return wbTransport.wipeAll().then(function() {
    wbCloudClearMeta();
    wbCloud.recIds = {}; wbCloud.lastShards = {}; wbCloud.synced = true;
    wbCloudPaint('empty');
  }).catch(function() { wbCloudClearMeta(); });
}
// 本机数据重置为示例时不擦云端，只清同步记录，下次打开会自动把云端真实数据取回来
function wbCloudResetLocal() {
  if (!wbCloud.ready) return;
  wbCloudClearMeta();
  wbCloud.recIds = {}; wbCloud.lastShards = {}; wbCloud.synced = false;
  wbCloudPaint('idle');
}

function init() {
  var loaded = loadData();
  if (!loaded) resetData();
  // 档丢检测：当前为示例班/空数据，但快照里有真实班数据 → 亮恢复提示条
  if (isSampleData() || (DATA.students && DATA.students.length === 0)) {
    var snaps = snapList().filter(function(s) { return s.data && s.teacher && s.teacher !== '张明'; });
    if (snaps.length) needRestoreBanner = true;
  }
  // 文档中心旧文件（base64 存于本地存储）自动迁移到 IndexedDB 文件库，迁移后释放本地存储空间
  migrateDocFilesToIdb().then(function(n) {
    if (n > 0) {
      toast('已将 ' + n + ' 个旧文件迁移到本机文件库，本地存储空间已释放');
      if (currentPage === 'docs') renderPage();
    }
  }).catch(function() {});
  // 旧版 base64 图片自动搬进 IndexedDB 图片库，迁移后本地存储空间被释放
  migrateMediaToIdb().then(function(n) {
    if (n > 0) {
      toast('已将 ' + n + ' 张图片迁入本机图片库，本地存储空间已释放');
      if (currentPage === 'communication' || currentPage === 'todo') renderPage();
    }
  }).catch(function() {});
  buildNav();
  renderPage();
  // 云端同步：能连上资料库就用云端做主数据源；连不上（本地双击打开）保持单机模式
  try { wbCloudInit(); } catch (e) { wbCloudPaint('off'); }
  updateClock();
  setInterval(updateClock, 1000);
  // 每日文件备份：等用户首次交互（有浏览器手势）再触发，避免被拦截
  var bkOnce = function() {
    tryDailyFileBackup();
    document.removeEventListener('pointerdown', bkOnce);
    document.removeEventListener('keydown', bkOnce);
  };
  document.addEventListener('pointerdown', bkOnce);
  document.addEventListener('keydown', bkOnce);
}

init();
</script>
